<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGraph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07111a"/>
      <stop offset="100%" stop-color="#04090d"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bgGraph)" stroke="#00D2B4" stroke-opacity="0.3"/>
  
  <!-- Root Node -->
  <g transform="translate(240, 40)">
    <rect width="120" height="60" rx="8" fill="#00D2B4" fill-opacity="0.15" stroke="#00D2B4" stroke-width="2"/>
    <text x="60" y="28" fill="#00D2B4" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">ROOT SPONSOR</text>
    <text x="60" y="46" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">JMT-FOUNDER</text>
  </g>

  <!-- Connector Lines -->
  <path d="M 300 100 L 300 140 M 120 140 L 480 140 M 120 140 L 120 180 M 300 140 L 300 180 M 480 140 L 480 180" stroke="#00D2B4" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Tier 1 Nodes -->
  <g transform="translate(60, 180)">
    <rect width="120" height="55" rx="8" fill="#0f2230" stroke="#1d425b" stroke-width="1.5"/>
    <text x="60" y="25" fill="#E5B568" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">TIER 1 NODE</text>
    <text x="60" y="42" fill="#90a4ae" font-family="monospace" font-size="10" text-anchor="middle">JMT-TEXAS</text>
  </g>

  <g transform="translate(240, 180)">
    <rect width="120" height="55" rx="8" fill="#0f2230" stroke="#1d425b" stroke-width="1.5"/>
    <text x="60" y="25" fill="#E5B568" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">TIER 1 NODE</text>
    <text x="60" y="42" fill="#90a4ae" font-family="monospace" font-size="10" text-anchor="middle">JMT-RANCH88</text>
  </g>

  <g transform="translate(420, 180)">
    <rect width="120" height="55" rx="8" fill="#0f2230" stroke="#1d425b" stroke-width="1.5"/>
    <text x="60" y="25" fill="#E5B568" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">TIER 1 NODE</text>
    <text x="60" y="42" fill="#90a4ae" font-family="monospace" font-size="10" text-anchor="middle">JMT-PACIFIC</text>
  </g>

  <text x="300" y="320" fill="#00D2B4" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">GENEALOGY DOWNLINE TOPOLOGY GRAPH</text>
  <text x="300" y="345" fill="#607d8b" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Real-time placement across 5 commission tiers</text>
</svg>
